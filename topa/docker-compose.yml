# `make run`: postgres + api + web with reload. Host ports stay off the common defaults
# so the stack runs next to other local projects.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: topa
      POSTGRES_PASSWORD: topa # pragma: allowlist secret (local throwaway database)
      POSTGRES_DB: topa
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topa"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    ports:
      - "8010:8000"
    environment:
      TOPA_DATABASE_URL: postgresql+psycopg://topa:topa@db:5432/topa
    volumes:
      - ./api/src:/app/src
      - ./api/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python, not curl: the slim image has none; a 503 keeps the container unhealthy
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5180"
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5180:5180"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
