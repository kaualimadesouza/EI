[package]
name = "topa"
version = "0.1.4"
description = "TOPA self-service ordering, as a desktop and Android app"
edition = "2024"
rust-version = "1.90"

[lib]
# the _lib suffix keeps the lib apart from the bin of the same name on Windows
name = "topa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-nfc = "2.4.2"
