name: Deploy Web

# Same model as argumenta-web: DEV (Vercel Preview + alias) on every push to main, PROD on
# release, plus a preview per PR. Deploys go through the Vercel CLI only; the git
# integration stays off (web/vercel.json). No VITE_API_URL: the cloud build runs in demo mode.
on:
  push:
    branches:
      - main
    paths:
      - topa/web/**
      - .github/workflows/deploy.yml
  pull_request:
    branches:
      - main
    paths:
      - topa/web/**
      - .github/workflows/deploy.yml
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod
  # release-please chains the prod deploy: a release made with GITHUB_TOKEN triggers nothing
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

concurrency:
  group: deploy-web-${{ inputs.environment || (github.event_name == 'release' && 'prod') || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENV_NAME: ${{ inputs.environment || (github.event_name == 'release' && 'prod') || (github.event_name == 'pull_request' && 'pr') || 'dev' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/web.yml

  # stays dormant until the Vercel project exists (a job-level `if` cannot read secrets)
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [ci, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topa/web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: topa/web/package-lock.json

      - name: Resolve environment
        run: |
          if [ "$ENV_NAME" = "prod" ]; then
            { echo "VERCEL_ENV=production"; echo "PROD_FLAG=--prod"; } >> "$GITHUB_ENV"
          else
            { echo "VERCEL_ENV=preview"; echo "PROD_FLAG="; } >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          if [ "$ENV_NAME" = "dev" ]; then
            vercel alias set "$URL" "${{ vars.VERCEL_DEV_ALIAS || 'topa-totem-dev.vercel.app' }}" --token="$VERCEL_TOKEN"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed $ENV_NAME: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- topa-preview -->'
            const body = `${marker}\nPreview: ${process.env.PREVIEW_URL}\n\nCommit ${context.payload.pull_request.head.sha.slice(0, 7)}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body.startsWith(marker))
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
