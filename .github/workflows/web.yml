name: Web

on:
  push:
    branches:
      - main
    paths:
      - topa/web/**
      - .github/workflows/web.yml
  pull_request:
    branches:
      - main
    paths:
      - topa/web/**
      - .github/workflows/web.yml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only PR pushes cancel a superseded run; a deploy calling this must never be cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: topa/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: topa/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test (100% coverage)
        run: npm test
      - run: npm run build
