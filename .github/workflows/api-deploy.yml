name: API deploy

# Builds topa/api as a Lambda image and applies topa/api/infrastructure with Terraform: DEV on
# push to main, PROD from release-please or by hand. Stays dormant until the AWS secrets exist;
# the one-time setup is in topa/api/infrastructure/README.md.
on:
  push:
    branches:
      - main
    paths:
      - topa/api/**
      - .github/workflows/api-deploy.yml
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (prod only from main)"
        required: true
        type: choice
        options:
          - dev
          - prod
  # release-please calls this for PROD: a release made with GITHUB_TOKEN triggers nothing
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

# one deploy at a time per environment, never cancelled halfway through a migration
concurrency:
  group: deploy-api-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ECR_REPOSITORY: topa-api
  ENV_NAME: ${{ inputs.environment || 'dev' }}

jobs:
  ci:
    uses: ./.github/workflows/api.yml

  # a job-level `if` cannot read secrets, so this decides once whether the deploy runs
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          READY: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && vars.TF_STATE_BUCKET != '' }}
        run: |
          case "$ENV_NAME" in
            dev | prod) ;;
            *) echo "::error::unknown environment '$ENV_NAME' (dev or prod)"; exit 1 ;;
          esac
          if [ "$ENV_NAME" = prod ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::prod deploys only from main, not $GITHUB_REF"
            exit 1
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [ci, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topa/api
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: us-east-1

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the Lambda image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --push \
            -f Dockerfile.lambda -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.26

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: us-east-1

      # re-derives the registry build-and-push pushed to rather than passing it through outputs
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # before the new image serves, so a migration must work with the code still running;
      # the direct URL, because Neon's pooler cannot hold the session a migration needs
      - name: Migrate the database
        working-directory: topa/api
        env:
          TOPA_DATABASE_URL: ${{ secrets.TOPA_DATABASE_URL_DIRECT }}
        run: |
          uv sync --locked --no-dev
          uv run --no-dev alembic upgrade head

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: topa/api/infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=topa-api/${ENV_NAME}/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform apply
        working-directory: topa/api/infrastructure
        env:
          TF_VAR_stage: ${{ env.ENV_NAME }}
          TF_VAR_image_uri: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          TF_VAR_topa_database_url: ${{ secrets.TOPA_DATABASE_URL }}
        run: terraform apply -auto-approve -input=false

      - name: Show the API URL
        working-directory: topa/api/infrastructure
        run: |
          echo "API ($ENV_NAME): $(terraform output -raw api_url)" >> "$GITHUB_STEP_SUMMARY"
